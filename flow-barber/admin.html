<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050403">
<title>Panel · Flow Barber</title>
<link rel="icon" href="assets/img/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="admin.css?v=20261030f">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" title="Ver la web">
      <img src="assets/img/logo.webp" alt="" width="36" height="36">
      <span>FLOW<i>//</i>PANEL</span>
    </a>
    <div class="top-actions" data-top-actions hidden>
      <button type="button" class="icon-btn" data-refresh aria-label="Actualizar">↻</button>
      <button type="button" class="link-btn mono" data-logout>Salir</button>
    </div>
  </header>

  <nav class="tabs" data-tabs hidden aria-label="Secciones">
    <button type="button" data-tab="agenda" class="is-on"><span aria-hidden="true">▦</span>Agenda</button>
    <button type="button" data-tab="proximas"><span aria-hidden="true">≡</span>Próximas</button>
    <button type="button" data-tab="nueva"><span aria-hidden="true">＋</span>Nueva cita</button>
    <button type="button" data-tab="cierres"><span aria-hidden="true">⊘</span>Cierres</button>
  </nav>

  <main class="main" data-main aria-live="polite">
    <p class="muted">Cargando…</p>
    <noscript><p>Este panel necesita JavaScript.</p></noscript>
  </main>

  <div class="toast" data-toast role="status" hidden></div>

  <dialog class="dlg" data-dialog>
    <form method="dialog" class="dlg-body" data-dialog-form></form>
  </dialog>

  <script defer src="lib/manifest.js?v=20261030f"></script>
  <script defer src="admin.js?v=20261030f"></script>
</body>
</html>
